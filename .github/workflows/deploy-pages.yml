name: Deploy TENDEN PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages が未有効化でも自動で有効にする

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './tenden-app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# trigger
